name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Declared minimum and current stable. The suite is stdlib-only, so this
        # brackets the supported range without a maintenance-heavy matrix.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No dependency installation: DSD is standard-library only by design.
      - name: Run the canonical test suite
        run: python3 -m unittest discover -s tests -t .
